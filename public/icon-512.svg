<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="pwa-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#pwa-bg)" />

  <!-- Inner subtle border glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-opacity="0.25" />

  <!-- Shield / Security & Social base -->
  <g filter="url(#shadow)">
    <!-- Main emblem: Wallet + Growth + Heart -->
    <!-- Wallet body -->
    <rect x="116" y="160" width="280" height="192" rx="36" fill="#ffffff" />
    <!-- Wallet flap -->
    <path d="M116 200 C 116 172, 138 150, 166 150 L 346 150 C 374 150, 396 172, 396 200 L 396 230 C 396 242, 386 252, 374 252 L 138 252 C 126 252, 116 242, 116 230 Z" fill="#ecfdf5" />
    <!-- Wallet clasp/card -->
    <rect x="300" y="226" width="96" height="60" rx="16" fill="url(#pwa-card)" />
    <circle cx="332" cy="256" r="10" fill="#ffffff" />

    <!-- Social Heart Badge in the corner -->
    <g transform="translate(144, 280)">
      <circle cx="28" cy="28" r="38" fill="#f43f5e" />
      <path d="M 28 46 L 24.8 43.1 C 13.5 32.8 6 26.0 6 17.6 C 6 10.8 11.3 5.5 18.1 5.5 C 22.0 5.5 25.6 7.3 28 10.2 C 30.4 7.3 34.0 5.5 37.9 5.5 C 44.7 5.5 50 10.8 50 17.6 C 50 26.0 42.5 32.8 31.2 43.1 Z" fill="#ffffff" transform="translate(0, 3) scale(0.9)" />
    </g>

    <!-- Upward Trend / Growth Star -->
    <g transform="translate(260, 100)">
      <circle cx="44" cy="44" r="32" fill="#10b981" stroke="#ffffff" stroke-width="6" />
      <path d="M30 52 L 40 42 L 47 49 L 58 34" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M50 34 L 58 34 L 58 42" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- App Label "PRO & SOCIAL" at bottom -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">FINANÇAS PRO</text>
  <text x="256" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="6">&amp; SOCIAL</text>
</svg>